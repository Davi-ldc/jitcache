<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9572b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" rx="18" fill="#ffffff"/>

  <!-- Title -->
  <text x="32" y="46" font-size="22" font-weight="700" fill="#1f2933">Writing the SPECs: the thread-prep workflow</text>
  <text x="32" y="70" font-size="13" fill="#5b6b7b">Every agent runs Claude Opus 5.5 with a 1M-token context. Authors write the whole design; reviewers only read.</text>

  <!-- Inputs: what every agent reads, in order -->
  <rect x="32" y="92" width="1176" height="116" rx="14" fill="#f4f6f8" stroke="#d5dbe1"/>
  <text x="48" y="117" font-size="12" font-weight="700" letter-spacing="1" fill="#5b6b7b">INPUTS · EVERY AGENT READS THEM, IN THIS ORDER</text>
  <g>
    <rect x="48" y="132" width="250" height="60" rx="10" fill="#ffffff" stroke="#cfd6dd"/>
    <circle cx="70" cy="162" r="11" fill="#5b6b7b"/>
    <text x="70" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="90" y="157" font-size="15" font-weight="700" fill="#1f2933">skills/</text>
    <text x="90" y="177" font-size="12.5" fill="#5b6b7b">how the engine works, read first</text>
    <line x1="300" y1="162" x2="326" y2="162" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="330" y="132" width="250" height="60" rx="10" fill="#ffffff" stroke="#cfd6dd"/>
    <circle cx="352" cy="162" r="11" fill="#5b6b7b"/>
    <text x="352" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="372" y="157" font-size="15" font-weight="700" fill="#1f2933">THREAD.md</text>
    <text x="372" y="177" font-size="12.5" fill="#5b6b7b">the design, the only authority</text>
    <line x1="582" y1="162" x2="608" y2="162" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="612" y="132" width="250" height="60" rx="10" fill="#ffffff" stroke="#cfd6dd"/>
    <circle cx="634" cy="162" r="11" fill="#5b6b7b"/>
    <text x="634" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="654" y="157" font-size="15" font-weight="700" fill="#1f2933">WebKit + Bun source</text>
    <text x="654" y="177" font-size="12.5" fill="#5b6b7b">every claim is checked here</text>
  </g>
  <line x1="888" y1="128" x2="888" y2="196" stroke="#d5dbe1" stroke-width="1.5"/>
  <rect x="912" y="132" width="280" height="60" rx="10" fill="#ffffff" stroke="#cfd6dd" stroke-dasharray="5 4"/>
  <text x="928" y="157" font-size="15" font-weight="700" fill="#1f2933">Native facts</text>
  <text x="928" y="177" font-size="12.5" fill="#5b6b7b">in the authors' prompts only, a few per part</text>

  <line x1="620" y1="210" x2="620" y2="238" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: lanes -->
  <rect x="32" y="242" width="340" height="346" rx="14" fill="#eef4fb" stroke="#b9d0ea"/>
  <text x="48" y="268" font-size="12" font-weight="700" letter-spacing="1" fill="#2f6fb0">1 · LANES, IN PARALLEL</text>
  <g font-size="12.5">
    <rect x="48" y="284" width="308" height="56" rx="10" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="62" y="317" font-size="15" font-weight="700" fill="#1f2933">UCB</text>
    <rect x="212" y="298" width="56" height="28" rx="14" fill="#2f6fb0"/>
    <text x="240" y="316" text-anchor="middle" fill="#ffffff" font-weight="600">write</text>
    <line x1="268" y1="312" x2="279" y2="312" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="282" y="298" width="68" height="28" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="316" y="316" text-anchor="middle" fill="#2f6fb0" font-weight="600">review ↺</text>

    <rect x="48" y="356" width="308" height="56" rx="10" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="62" y="389" font-size="15" font-weight="700" fill="#1f2933">Image</text>
    <rect x="212" y="370" width="56" height="28" rx="14" fill="#2f6fb0"/>
    <text x="240" y="388" text-anchor="middle" fill="#ffffff" font-weight="600">write</text>
    <line x1="268" y1="384" x2="279" y2="384" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="282" y="370" width="68" height="28" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="316" y="388" text-anchor="middle" fill="#2f6fb0" font-weight="600">review ↺</text>

    <rect x="48" y="428" width="308" height="56" rx="10" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="62" y="461" font-size="15" font-weight="700" fill="#1f2933">CB state</text>
    <rect x="212" y="442" width="56" height="28" rx="14" fill="#2f6fb0"/>
    <text x="240" y="460" text-anchor="middle" fill="#ffffff" font-weight="600">write</text>
    <line x1="268" y1="456" x2="279" y2="456" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="282" y="442" width="68" height="28" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="316" y="460" text-anchor="middle" fill="#2f6fb0" font-weight="600">review ↺</text>

    <rect x="48" y="500" width="308" height="56" rx="10" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="62" y="533" font-size="15" font-weight="700" fill="#1f2933">ICs + call links</text>
    <rect x="212" y="514" width="56" height="28" rx="14" fill="#2f6fb0"/>
    <text x="240" y="532" text-anchor="middle" fill="#ffffff" font-weight="600">write</text>
    <line x1="268" y1="528" x2="279" y2="528" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="282" y="514" width="68" height="28" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="316" y="532" text-anchor="middle" fill="#2f6fb0" font-weight="600">review ↺</text>
  </g>
  <text x="48" y="576" font-size="12" font-style="italic" fill="#5b6b7b">each lane reviews as soon as its author is done</text>

  <!-- Lanes converge -->
  <g stroke="#5b6b7b" stroke-width="2" fill="none">
    <line x1="356" y1="312" x2="386" y2="312"/>
    <line x1="356" y1="384" x2="386" y2="384"/>
    <line x1="356" y1="456" x2="386" y2="456"/>
    <line x1="356" y1="528" x2="386" y2="528"/>
    <line x1="386" y1="312" x2="386" y2="528"/>
  </g>
  <line x1="386" y1="420" x2="400" y2="420" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="404" y="242" width="176" height="346" rx="14" fill="#eef4fb" stroke="#b9d0ea"/>
  <text x="420" y="268" font-size="12" font-weight="700" letter-spacing="1" fill="#2f6fb0">2 · GLOBAL REVIEW</text>
  <text x="492" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">the 4 lane SPECs</text>
  <text x="492" y="329" text-anchor="middle" font-size="12.5" fill="#5b6b7b">read as one system</text>
  <g font-size="12.5" text-anchor="middle" fill="#1f2933">
    <rect x="428" y="354" width="128" height="24" rx="12" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="492" y="370">cohesion</text>
    <rect x="428" y="386" width="128" height="24" rx="12" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="492" y="402">end-to-end flows</text>
    <rect x="428" y="418" width="128" height="24" rx="12" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="492" y="434">performance</text>
  </g>
  <rect x="428" y="470" width="128" height="28" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
  <text x="492" y="488" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2f6fb0">one reviser ↺</text>
  <text x="492" y="522" text-anchor="middle" font-size="12" fill="#5b6b7b">may edit every SPEC</text>

  <line x1="582" y1="420" x2="608" y2="420" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="612" y="242" width="176" height="346" rx="14" fill="#fdf4e6" stroke="#ecc58a"/>
  <text x="628" y="268" font-size="12" font-weight="700" letter-spacing="1" fill="#b7791f">3 · INTEGRATOR</text>
  <text x="700" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">derived from</text>
  <text x="700" y="329" text-anchor="middle" font-size="12.5" fill="#5b6b7b">the frozen lanes</text>
  <rect x="652" y="360" width="96" height="28" rx="14" fill="#d08a24"/>
  <text x="700" y="378" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">write</text>
  <line x1="700" y1="388" x2="700" y2="410" stroke="#d08a24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="652" y="414" width="96" height="28" rx="14" fill="#ffffff" stroke="#d08a24" stroke-width="1.5"/>
  <text x="700" y="432" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b7791f">review ↺</text>
  <text x="700" y="474" text-anchor="middle" font-size="12" fill="#5b6b7b">header, file format,</text>
  <text x="700" y="491" text-anchor="middle" font-size="12" fill="#5b6b7b">API and the glue that</text>
  <text x="700" y="508" text-anchor="middle" font-size="12" fill="#5b6b7b">calls the lanes in order</text>

  <line x1="790" y1="420" x2="816" y2="420" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="820" y="242" width="176" height="346" rx="14" fill="#eef4fb" stroke="#b9d0ea"/>
  <text x="836" y="268" font-size="12" font-weight="700" letter-spacing="1" fill="#2f6fb0">4 · GLOBAL REVIEW</text>
  <text x="908" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">all 5 SPECs</text>
  <text x="908" y="329" text-anchor="middle" font-size="12.5" fill="#5b6b7b">same three lenses</text>
  <rect x="844" y="370" width="128" height="28" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
  <text x="908" y="388" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2f6fb0">one reviser ↺</text>
  <text x="908" y="422" text-anchor="middle" font-size="12" fill="#5b6b7b">may edit every SPEC</text>

  <!-- Outputs of thread-prep -->
  <line x1="998" y1="320" x2="1024" y2="320" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1028" y="242" width="180" height="156" rx="12" fill="#e9f6ec" stroke="#8fcb9f"/>
  <text x="1044" y="268" font-size="12" font-weight="700" letter-spacing="1" fill="#2f855a">OUTPUT</text>
  <text x="1044" y="296" font-size="14" font-weight="700" fill="#1f2933">docs/JitCache/specs/</text>
  <text x="1044" y="318" font-size="12.5" fill="#5b6b7b">one SPEC per part, and</text>
  <text x="1044" y="336" font-size="12.5" fill="#5b6b7b">its history: why each</text>
  <text x="1044" y="354" font-size="12.5" fill="#5b6b7b">non-obvious decision is</text>
  <text x="1044" y="372" font-size="12.5" fill="#5b6b7b">the way it is</text>

  <line x1="998" y1="520" x2="1024" y2="520" stroke="#d9572b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
  <rect x="1028" y="422" width="180" height="166" rx="12" fill="#fdebe4" stroke="#eaa68d"/>
  <text x="1044" y="448" font-size="12" font-weight="700" letter-spacing="1" fill="#c05621">FOR HUMAN REVIEW</text>
  <text x="1044" y="476" font-size="14" font-weight="700" fill="#1f2933">drawer.md</text>
  <text x="1044" y="498" font-size="12.5" fill="#5b6b7b">THREAD gaps and minor</text>
  <text x="1044" y="516" font-size="12.5" fill="#5b6b7b">findings, from every</text>
  <text x="1044" y="534" font-size="12.5" fill="#5b6b7b">stage</text>

  <!-- Human loop -->
  <rect x="32" y="624" width="340" height="128" rx="12" fill="#fdebe4" stroke="#eaa68d"/>
  <text x="48" y="654" font-size="15" font-weight="700" fill="#1f2933">Human review</text>
  <text x="48" y="678" font-size="12.5" fill="#5b6b7b">empty the drawer, settle each gap in</text>
  <text x="48" y="697" font-size="12.5" fill="#5b6b7b">THREAD, then run thread-prep again</text>
  <polyline points="1118,590 1118,606 200,606 200,620" fill="none" stroke="#d9572b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
  <polyline points="32,676 16,676 16,150 28,150" fill="none" stroke="#d9572b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>

  <!-- Review loop key -->
  <rect x="404" y="624" width="592" height="128" rx="12" fill="#ffffff" stroke="#d5dbe1"/>
  <text x="420" y="648" font-size="14" font-weight="700" fill="#1f2933">↺ review loop</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="420" y="662" width="176" height="28" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="508" y="680" fill="#2f6fb0" font-weight="600">reviewers, one lens each</text>
    <line x1="596" y1="676" x2="616" y2="676" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="620" y="662" width="92" height="28" rx="14" fill="#2f6fb0"/>
    <text x="666" y="680" fill="#ffffff" font-weight="600">reviser</text>
    <line x1="712" y1="676" x2="734" y2="662" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="712" y1="676" x2="734" y2="690" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="738" y="648" width="72" height="24" rx="12" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="774" y="664" fill="#1f2933">fixes</text>
    <line x1="810" y1="660" x2="830" y2="660" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="834" y="648" width="146" height="24" rx="4" fill="#ffffff" stroke="#b9d0ea"/>
    <text x="907" y="664" fill="#1f2933" font-weight="600">SPEC</text>
    <rect x="738" y="680" width="72" height="24" rx="12" fill="#ffffff" stroke="#8fcb9f"/>
    <text x="774" y="696" fill="#1f2933">refutes</text>
    <line x1="810" y1="692" x2="830" y2="692" stroke="#2f855a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="834" y="680" width="146" height="24" rx="4" fill="#e9f6ec" stroke="#8fcb9f"/>
    <text x="907" y="696" fill="#1f2933"><tspan font-weight="700">history</tspan>: why not</text>
  </g>
  <g font-size="12" fill="#5b6b7b">
    <text x="420" y="726">Minor findings go to the drawer. The next pass reviews from scratch, until a clean one (max 4).</text>
    <text x="420" y="743">A THREAD gap never stops the run: the writer makes a marked, provisional choice.</text>
  </g>

  <!-- Afterwards -->
  <polyline points="1208,320 1224,320 1224,648 1212,648" fill="none" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1028" y="620" width="180" height="56" rx="12" fill="#f3effa" stroke="#c9b8e6"/>
  <text x="1044" y="644" font-size="14" font-weight="700" fill="#6b46c1">5 · compact specs</text>
  <text x="1044" y="663" font-size="12" fill="#5b6b7b">same rules, shorter text</text>
  <line x1="1118" y1="676" x2="1118" y2="704" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1028" y="708" width="180" height="56" rx="12" fill="#e9f6ec" stroke="#8fcb9f"/>
  <text x="1044" y="732" font-size="14" font-weight="700" fill="#2f855a">6 · implement</text>
  <text x="1044" y="751" font-size="12" fill="#5b6b7b">from the sealed SPECs</text>
</svg>
